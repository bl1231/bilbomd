version: 2
updates:
  # 1) GitHub Actions updates (low effort, high value)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '10:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'

  # 2) Root (sometimes you have tooling deps here)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '10:15'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 5
    versioning-strategy: 'increase'
    # eslint v10 blocked until eslint-plugin-react and eslint-plugin-react-hooks
    # ship stable releases with v10 peer dep support
    ignore:
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
    groups:
      root-prod:
        dependency-type: 'production'
        patterns: ['*']
      root-dev:
        dependency-type: 'development'
        patterns: ['*']

  # 3) Workspaces — add one block per workspace directory that has a package.json
  # Example: apps/*
  - package-ecosystem: 'npm'
    directory: '/apps/backend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '10:30'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 5
    versioning-strategy: 'increase'
    ignore:
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
    groups:
      backend-prod:
        dependency-type: 'production'
        patterns: ['*']
      backend-dev:
        dependency-type: 'development'
        patterns: ['*']

  - package-ecosystem: 'npm'

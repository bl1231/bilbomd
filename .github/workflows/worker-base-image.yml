name: Build and Push Worker Base Image

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/bilbomd-worker-base.dockerfile'
      - 'apps/worker/base-image-version'
  pull_request:
    branches: [main]
    paths:
      - 'apps/worker/bilbomd-worker-base.dockerfile'
      - 'apps/worker/base-image-version'
  workflow_dispatch:
    inputs:
      version:
        description: "Semver for image (e.g. 1.2.3 or 1.2.3-beta.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-bilbomd-worker-base:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bilbomd-worker-base
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Free up runner disk space
        run: |
          echo "Before cleanup:"
          df -h
          echo ""

          echo "Checking what's taking up space..."
          sudo du -sh /usr/share/* 2>/dev/null | sort -hr | head -10 || true
          echo ""

          # Remove common space-hogging directories
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost /usr/local/share/vcpkg /usr/local/share/chromium
          sudo rm -rf /usr/share/swift /usr/local/share/powershell
          sudo rm -rf /opt/az /usr/share/gradle* /usr/local/share/cmake*

          # Clean apt cache
          sudo apt-get clean

          # Clean docker
          sudo docker system prune -af --volumes

          echo "After cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and semver flag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\-+][0-9A-Za-z\.-]+)?$ ]]; then
              echo "Invalid semver: $version"
              exit 1
            fi
            if docker manifest inspect ${{ env.IMAGE_NAME }}:$version >/dev/null 2>&1; then
              echo "❌ Version $version already exists in registry"
              exit 1
            fi
            echo "VERSION=$version" >> "$GITHUB_ENV"
            echo "SHOULD_SEMVER=true" >> "$GITHUB_ENV"
          else
            version="$(cat apps/worker/base-image-version | tr -d '[:space:]')"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\-+][0-9A-Za-z\.-]+)?$ ]]; then
              echo "Invalid semver in base-image-version: $version"
              exit 1
            fi
            echo "VERSION=$version" >> "$GITHUB_ENV"
            PREV="$(git show HEAD^:apps/worker/base-image-version 2>/dev/null | tr -d '[:space:]' || echo '')"
            if [ -z "$PREV" ] || [ "$version" != "$PREV" ]; then
              echo "SHOULD_SEMVER=true" >> "$GITHUB_ENV"
            else
              echo "SHOULD_SEMVER=false" >> "$GITHUB_ENV"
            fi
          fi

      - name: Compute short SHA
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # main push: always add latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # main push or workflow_dispatch: semver when version changed
            type=raw,value=${{ env.VERSION }},enable=${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && env.SHOULD_SEMVER == 'true' }}
            # main push or workflow_dispatch: sha tag
            type=raw,value=sha-${{ env.SHORT_SHA }},enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
            # pull requests (same-repo only): pr-NNN-SHA
            type=raw,value=pr-${{ github.event.pull_request.number }}-${{ env.SHORT_SHA }},enable=${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          labels: |
            org.opencontainers.image.title=BilboMD Worker Base Image
            org.opencontainers.image.source=${{ github.repository }}

      - name: Build and push base image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/bilbomd-worker-base.dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          cache-from: |
            type=gha,scope=worker-base
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,scope=worker-base,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Run smoke test on built image
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Running smoke test on freshly built image..."
          docker pull ${{ env.IMAGE_NAME }}:sha-${{ env.SHORT_SHA }}
          docker run --rm --platform linux/amd64 \
            ${{ env.IMAGE_NAME }}:sha-${{ env.SHORT_SHA }} \
            /usr/local/bin/smoke_test.sh

name: Build and Push Worker Base Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver for image (e.g. 1.2.3 or 1.2.3-beta.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-bilbomd-worker-base:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bilbomd-worker-base
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free up runner disk space
        run: |
          echo "Before cleanup:"
          df -h
          echo ""

          echo "Checking what's taking up space..."
          sudo du -sh /usr/share/* 2>/dev/null | sort -hr | head -10 || true
          echo ""

          # Remove common space-hogging directories
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost /usr/local/share/vcpkg /usr/local/share/chromium
          sudo rm -rf /usr/share/swift /usr/local/share/powershell
          sudo rm -rf /opt/az /usr/share/gradle* /usr/local/share/cmake*

          # Clean apt cache
          sudo apt-get clean

          # Clean docker
          sudo docker system prune -af --volumes

          echo "After cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version input
        run: |
          version="${{ inputs.version }}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\-+][0-9A-Za-z\.-]+)?$ ]]; then
            echo "Invalid semver: $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check if version exists
        run: |
          version="${{ inputs.version }}"
          if docker manifest inspect ${{ env.IMAGE_NAME }}:$version >/dev/null 2>&1; then
            echo "❌ Version $version already exists in registry"
            echo "Please use a new version number"
            exit 1
          else
            echo "✅ Version $version is available"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # latest on main branch
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
            # semver tags derived from manual input
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            # fallback tags for branches/commits
            type=ref,event=branch
            type=sha
          labels: |
            org.opencontainers.image.title=BilboMD Worker Base Image
            org.opencontainers.image.source=${{ github.repository }}

      - name: Build and push base image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/bilbomd-worker-base.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          cache-from: |
            type=gha,scope=worker-base
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,scope=worker-base,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Run smoke test on built image
        run: |
          echo "Running smoke test on freshly built image..."
          docker run --rm --platform linux/amd64 \
            ${{ env.IMAGE_NAME }}:${{ inputs.version }} \
            /usr/local/bin/smoke_test.sh

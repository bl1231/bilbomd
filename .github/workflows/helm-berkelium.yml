name: Berkelium Helm chart

# ci.yml ignores infra/**, so the Berkelium chart gets its own check.
on:
  push:
    branches: [main]
    paths:
      - 'infra/helm-berkelium/**'
      - 'infra/scripts/**'
      - '.github/workflows/helm-berkelium.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/helm-berkelium/**'
      - 'infra/scripts/**'
      - '.github/workflows/helm-berkelium.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  chart:
    name: Lint and unit-test chart + infra scripts
    runs-on: [ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Image-tag sync script tests
        run: node --test infra/scripts/__tests__/

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.2.1 --verify=false

      - name: Lint
        run: helm lint --strict infra/helm-berkelium

      - name: Render
        run: helm template bilbomd infra/helm-berkelium > /dev/null

      - name: Unit tests
        run: helm unittest infra/helm-berkelium

name: Build and Push MSA Service Image

on:
  push:
    branches: [main]
    paths:
      - 'apps/msa-service/**'
  # PRs build the image (nothing is pushed) so a broken Dockerfile shows up
  # before merge; the CUDA compile of mmseqs is the slow, fragile step.
  pull_request:
    paths:
      - 'apps/msa-service/**'
      - '.github/workflows/msa-service-image.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver for image (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-msa-service:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bilbomd-msa-service
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost /usr/local/share/vcpkg /usr/local/share/chromium
          sudo rm -rf /usr/share/swift /usr/local/share/powershell
          sudo rm -rf /opt/az /usr/share/gradle* /usr/local/share/cmake*
          sudo apt-get clean
          sudo docker system prune -af --volumes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="$(cat apps/msa-service/version | tr -d '[:space:]')"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\-+][0-9A-Za-z\.-]+)?$ ]]; then
            echo "Invalid semver: $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Detect version bump
        run: |
          CURR="$(cat apps/msa-service/version | tr -d '[:space:]')"
          PREV="$(git show HEAD^:apps/msa-service/version 2>/dev/null | tr -d '[:space:]' || echo '')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$PREV" ] || [ "$CURR" != "$PREV" ]; then
            echo "SHOULD_SEMVER=true" >> "$GITHUB_ENV"
          else
            echo "SHOULD_SEMVER=false" >> "$GITHUB_ENV"
          fi

      - name: Compute short SHA
        run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.VERSION }},enable=${{ github.ref == 'refs/heads/main' && env.SHOULD_SEMVER == 'true' }}
            type=raw,value=sha-${{ env.SHORT_SHA }},enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=BilboMD MSA Service
            org.opencontainers.image.source=${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: apps/msa-service
          file: apps/msa-service/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          platforms: linux/amd64
          # No type=gha cache: the CUDA devel builder stage alone is ~10GB and
          # would evict the pnpm-store cache CI relies on. The registry
          # buildcache keeps the slow MMseqs2 CUDA compile cached.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          # PR builds aren't logged in to GHCR, so they can only read the cache.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE_NAME) || '' }}

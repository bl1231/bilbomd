name: Build and Push Scoper Base Image

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - apps/scoper/bilbomd-scoper-base.dockerfile
            - apps/scoper/environment.yml
    pull_request:
        branches:
            - main
        paths:
            - apps/scoper/bilbomd-scoper-base.dockerfile
            - apps/scoper/environment.yml

permissions:
    contents: read
    packages: write
    attestations: write
    id-token: write

jobs:
    build-base:
        runs-on: ubuntu-latest
        env:
            IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bilbomd-scoper-base
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up QEMU (for multi-arch)
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
                      type=sha
                      type=ref,event=branch
                  labels: |
                      org.opencontainers.image.title=BilboMD Scoper Base Image
                      org.opencontainers.image.source=${{ github.repository }}

            - name: Build and push base image
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/scoper/bilbomd-scoper-base.dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  provenance: false
                  cache-from: |
                      type=gha,scope=scoper-base
                      type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
                  cache-to: |
                      type=gha,scope=scoper-base,mode=max
                      type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

name: Build and Push OF3 Service Image

on:
  push:
    branches: [main]
    paths:
      - 'apps/of3-service/**'
  workflow_dispatch:
    inputs:
      version:
        description: "Semver for image (e.g. 1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-of3-service:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bilbomd-of3-service
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost /usr/local/share/vcpkg /usr/local/share/chromium
          sudo rm -rf /usr/share/swift /usr/local/share/powershell
          sudo rm -rf /opt/az /usr/share/gradle* /usr/local/share/cmake*
          sudo apt-get clean
          sudo docker system prune -af --volumes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="$(cat apps/of3-service/version | tr -d '[:space:]')"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\-+][0-9A-Za-z\.-]+)?$ ]]; then
            echo "Invalid semver: $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Detect version bump
        run: |
          CURR="$(cat apps/of3-service/version | tr -d '[:space:]')"
          PREV="$(git show HEAD^:apps/of3-service/version 2>/dev/null | tr -d '[:space:]' || echo '')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$PREV" ] || [ "$CURR" != "$PREV" ]; then
            echo "SHOULD_SEMVER=true" >> "$GITHUB_ENV"
          else
            echo "SHOULD_SEMVER=false" >> "$GITHUB_ENV"
          fi

      - name: Compute short SHA
        run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.VERSION }},enable=${{ github.ref == 'refs/heads/main' && env.SHOULD_SEMVER == 'true' }}
            type=raw,value=sha-${{ env.SHORT_SHA }},enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=BilboMD OF3 Service
            org.opencontainers.image.source=${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: apps/of3-service
          file: apps/of3-service/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          platforms: linux/amd64
          cache-from: |
            type=gha,scope=of3-service
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,scope=of3-service,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

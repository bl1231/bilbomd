      - name: Resolve pnpm version from package.json
        id: pnpm_version
        run: |
          PNPM_VERSION=$(jq -r '.packageManager' package.json | sed -E 's/^pnpm@([0-9.]+).*/\1/')
          echo "pnpm_version=$PNPM_VERSION" >> $GITHUB_OUTPUT

      - name: Activate pnpm
        run: corepack prepare pnpm@${{ steps.pnpm_version.outputs.pnpm_version }} --activate

      - name: Determine pnpm store path
        id: pnpm_store
        run: echo "store_path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm_store.outputs.store_path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install deps
        run: |
          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            pnpm install --prefer-offline
          else
            pnpm install --frozen-lockfile --prefer-offline
          fi

      - name: Build shared schema
        run: pnpm -C packages/mongodb-schema run build

      - name: Build shared types
        run: pnpm -C packages/bilbomd-types run build

      - name: Build md-utils (depends on schema)
        run: pnpm -C packages/md-utils run build

      - name: Wait for Mongo to be ready
        run: |
          echo "Waiting for MongoDB port and ping..."
          for i in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/27017) >/dev/null 2>&1; then
              echo "MongoDB TCP port open";
              CONTAINER_ID=$(docker ps -q --filter "ancestor=mongo:7" | head -n1)
              if [ -n "$CONTAINER_ID" ]; then
                if docker exec "$CONTAINER_ID" mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; then
                  echo "MongoDB ping OK"; break;
                fi
              fi
            fi
            echo "Waiting for Mongo..."; sleep 2;
          done

      - name: Run backend integration tests
        run: pnpm -C apps/backend run test:integration

  gate:
    name: Branch Protection Gate
    runs-on: [ubuntu-24.04]
    needs:
      [
        lint,
        backend,
        ui,
        worker,
        scoper,
        schema,
        md-utils,
        backend-unit-tests,
        ui-unit-tests,
        worker-unit-tests,
        scoper-unit-tests,
        scoper-typecheck,
        backend-integration-tests,
      ]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]')
    env:
      LINT: ${{ needs.lint.result }}
      BACKEND: ${{ needs.backend.result }}
      UI: ${{ needs.ui.result }}
      WORKER: ${{ needs.worker.result }}
      SCOPER: ${{ needs.scoper.result }}
      SCHEMA: ${{ needs.schema.result }}
      MDUTILS: ${{ needs['md-utils'].result }}
      BACKEND_UNIT: ${{ needs['backend-unit-tests'].result }}
      UI_UNIT: ${{ needs['ui-unit-tests'].result }}
      WORKER_UNIT: ${{ needs['worker-unit-tests'].result }}
      SCOPER_UNIT: ${{ needs['scoper-unit-tests'].result }}
      SCOPER_TYPE: ${{ needs['scoper-typecheck'].result }}
      BACKEND_INT: ${{ needs['backend-integration-tests'].result }}
    steps:
      - name: Check build results
        run: |
          set -e
          for job in LINT BACKEND UI WORKER SCOPER SCHEMA MDUTILS BACKEND_UNIT UI_UNIT WORKER_UNIT SCOPER_UNIT SCOPER_TYPE BACKEND_INT; do
            result="${!job}"
            echo "$job result: $result"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Job $job failed or was cancelled"
              exit 1
            fi
          done
          echo "All required jobs succeeded"

  coverage-report:
    name: Update Coverage in README
    runs-on: ubuntu-24.04
    needs: [backend-unit-tests, ui-unit-tests, worker-unit-tests, scoper-unit-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm build

      - name: Run backend tests with coverage
        run: pnpm -C apps/backend run test

      - name: Run ui tests with coverage
        run: pnpm -C apps/ui run test

      - name: Run worker tests with coverage
        run: pnpm -C apps/worker run test

      - name: Run scoper tests with coverage
        run: pnpm -C apps/scoper run test

      - name: Update README with coverage
        run: node .github/scripts/update-coverage-readme.js

      - name: Commit coverage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update test coverage in README [skip ci]"
          git push

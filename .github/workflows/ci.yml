  backend-integration-tests:
    name: Test backend (integration)
    if: needs.changes.outputs.backend == 'true'
    needs: [changes, lint]
    runs-on: [ubuntu-24.04]
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=5s
          --health-timeout=5s
          --health-start-period=30s
          --health-retries=30
    env:
      # Override integration test DB to use the service
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/bilbomd-test
      # Secrets used by auth middleware during integration tests
      ACCESS_TOKEN_SECRET: test-access-secret
      REFRESH_TOKEN_SECRET: test-refresh-secret
      BILBOMD_API_TOKEN: test-external-api-token
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Use Node (from .nvmrc if present)
        uses: actions/setup-node@v6
        with:

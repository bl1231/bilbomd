name: BilboMD CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**/*.md"
      - "infra/**"
      - "test_scripts/**"
      - "apps/worker/base-image-version"
      - "apps/worker/bilbomd-worker-base.dockerfile"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**/*.md"
      - "infra/**"
      - "test_scripts/**"
      - "apps/worker/base-image-version"
      - "apps/worker/bilbomd-worker-base.dockerfile"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: [ubuntu-24.04]
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ui: ${{ steps.filter.outputs.ui }}
      worker: ${{ steps.filter.outputs.worker }}
      scoper: ${{ steps.filter.outputs.scoper }}
      schema: ${{ steps.filter.outputs.schema }}
      md-utils: ${{ steps.filter.outputs.md-utils }}
    steps:
      - uses: actions/checkout@v6

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            backend:
              - 'apps/backend/**'
              - 'tools/python/**'
              - 'packages/mongodb-schema/**'
              - 'packages/md-utils/**'
              - 'packages/eslint-config/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'apps/backend/bilbomd-backend.dockerfile'
            ui:
              - 'apps/ui/**'
              - 'packages/mongodb-schema/**'
              - 'packages/eslint-config/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'apps/ui/bilbomd-ui.dockerfile'
            worker:
              - 'apps/worker/**'
              - 'tools/python/**'
              - 'packages/mongodb-schema/**'
              - 'packages/md-utils/**'
              - 'packages/eslint-config/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'apps/worker/bilbomd-worker.dockerfile'
            scoper:
              - 'apps/scoper/**'
              - 'packages/mongodb-schema/**'
              - 'packages/eslint-config/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'apps/scoper/bilbomd-scoper.dockerfile'
            schema:
              - 'packages/mongodb-schema/**'
              - 'packages/eslint-config/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            md-utils:
              - 'packages/md-utils/**'
              - 'packages/bilbomd-types/**'
              - 'packages/mongodb-schema/**'
              - 'packages/eslint-config/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'

  lint:
    name: Lint
    runs-on: [ubuntu-24.04]
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Use Node (from .nvmrc if present)
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm version from package.json
        id: pnpm_version
        run: |
          PNPM_VERSION=$(jq -r '.packageManager' package.json | sed -E 's/^pnpm@([0-9.]+).*/\1/')
          echo "pnpm_version=$PNPM_VERSION" >> $GITHUB_OUTPUT

      - name: Activate pnpm
        run: corepack prepare pnpm@${{ steps.pnpm_version.outputs.pnpm_version }} --activate

      - name: Determine pnpm store path
        id: pnpm_store
        run: echo "store_path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm_store.outputs.store_path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Turborepo outputs
        uses: actions/cache@v5
        with:
          path: |
            .turbo
            apps/backend/.turbo
            apps/ui/.turbo
            apps/worker/.turbo
            apps/scoper/.turbo
            packages/bilbomd-types/.turbo
            packages/md-utils/.turbo
            packages/mongodb-schema/.turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install deps
        run: |
          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            pnpm install --prefer-offline
          else
            pnpm install --frozen-lockfile --prefer-offline
          fi

      # Lint
      - name: Lint all apps and packages
        run: |
          echo "Running lint across the entire monorepo..."
          pnpm -r run lint --cache

  backend:
    name: Build & Push backend
    if: needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]')
    needs: [changes, lint]
    runs-on: [ubuntu-24.04]
    permissions:
      contents: read
      packages: write
    concurrency:
      group: backend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from package.json
        run: echo "VERSION=$(jq -r .version 'apps/backend/package.json')" >> $GITHUB_ENV

      - name: Compute short sha
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Detect version bump (backend)
        id: bump
        shell: bash
        run: |
          CURR="$(jq -r .version apps/backend/package.json)"
          PREV="$(git show HEAD^:apps/backend/package.json 2>/dev/null | jq -r .version || echo '')"
          echo "curr=$CURR prev=$PREV"
          if [ -n "$PREV" ] && [ "$CURR" != "$PREV" ]; then
            echo "SHOULD_SEMVER=true" >> "$GITHUB_ENV"
          else
            echo "SHOULD_SEMVER=false" >> "$GITHUB_ENV"
          fi

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bilbomd-backend
          tags: |
            # main: semver only if version bumped
            type=raw,value=${{ env.VERSION }},enable=${{ github.ref == 'refs/heads/main' && env.SHOULD_SEMVER == 'true' }}
            # main: always add 'latest' tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # pull requests: single concise tag
            type=raw,value=pr-${{ github.event.pull_request.number }}-${{ env.SHORT_SHA }},enable=${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/bilbomd-backend.dockerfile
          push: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            USER_ID=${{ vars.USER_ID || '1001' }}
            GROUP_ID=${{ vars.GROUP_ID || '1234' }}
            BACKEND_GIT_HASH=${{ github.sha }}
            BACKEND_VERSION=${{ env.VERSION }}
          # Removed local cache-from/cache-to for GitHub-hosted runners

  ui:
    name: Build & Push ui
    if: needs.changes.outputs.ui == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]')
    needs: [changes, lint]
    runs-on: [ubuntu-24.04]
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ui-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        run: echo "VERSION=$(jq -r .version 'apps/ui/package.json')" >> $GITHUB_ENV

      - name: Compute short sha
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Detect version bump (ui)
        id: bump
        shell: bash
        run: |
          CURR="$(jq -r .version apps/ui/package.json)"
          PREV="$(git show HEAD^:apps/ui/package.json 2>/dev/null | jq -r .version || echo '')"
          echo "curr=$CURR prev=$PREV"
          if [ -n "$PREV" ] && [ "$CURR" != "$PREV" ]; then
            echo "SHOULD_SEMVER=true" >> "$GITHUB_ENV"
          else
            echo "SHOULD_SEMVER=false" >> "$GITHUB_ENV"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bilbomd-ui
          tags: |
            # main: semver only if version bumped
            type=raw,value=${{ env.VERSION }},enable=${{ github.ref == 'refs/heads/main' && env.SHOULD_SEMVER == 'true' }}
            # main: always add 'latest' tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # pull requests: single concise tag
            type=raw,value=pr-${{ github.event.pull_request.number }}-${{ env.SHORT_SHA }},enable=${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

      # Removed local buildx cache setup for GitHub-hosted runners

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/ui/bilbomd-ui.dockerfile
          push: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            USER_ID=${{ vars.USER_ID || '1001' }}
            GROUP_ID=${{ vars.GROUP_ID || '1234' }}
            UI_GIT_HASH=${{ github.sha }}
            UI_VERSION=${{ env.VERSION }}
          # Removed local cache-from/cache-to for GitHub-hosted runners

  worker:
    name: Build & Push worker
    if: needs.changes.outputs.worker == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]')
    needs: [changes, lint]
    runs-on: [ubuntu-24.04]
    permissions:
      contents: read
      packages: write
    concurrency:
      group: worker-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        run: echo "VERSION=$(jq -r .version 'apps/worker/package.json')" >> $GITHUB_ENV

      - name: Compute short sha
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Detect version bump (worker)
        id: bump
        shell: bash
        run: |
          CURR="$(jq -r .version apps/worker/package.json)"
          PREV="$(git show HEAD^:apps/worker/package.json 2>/dev/null | jq -r .version || echo '')"
          echo "curr=$CURR prev=$PREV"
          if [ -n "$PREV" ] && [ "$CURR" != "$PREV" ]; then
            echo "SHOULD_SEMVER=true" >> "$GITHUB_ENV"
          else
            echo "SHOULD_SEMVER=false" >> "$GITHUB_ENV"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bilbomd-worker
          tags: |
            # main: semver only if version bumped
            type=raw,value=${{ env.VERSION }},enable=${{ github.ref == 'refs/heads/main' && env.SHOULD_SEMVER == 'true' }}
            # main: always add 'latest' tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # pull requests: single concise tag
            type=raw,value=pr-${{ github.event.pull_request.number }}-${{ env.SHORT_SHA }},enable=${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

      # Removed local buildx cache setup for GitHub-hosted runners

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/bilbomd-worker.dockerfile
          push: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            USER_ID=${{ vars.USER_ID || '1001' }}
            GROUP_ID=${{ vars.GROUP_ID || '1234' }}
            WORKER_GIT_HASH=${{ github.sha }}
            WORKER_VERSION=${{ env.VERSION }}
          # Removed local cache-from/cache-to for GitHub-hosted runners

  scoper:
    name: Build & Push scoper
    if: needs.changes.outputs.scoper == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]')
    needs: [changes, lint, scoper-typecheck]
    runs-on: [ubuntu-24.04]
    permissions:
      contents: read
      packages: write
    concurrency:
      group: scoper-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        run: echo "VERSION=$(jq -r .version 'apps/scoper/package.json')" >> $GITHUB_ENV

      - name: Compute short sha
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Detect version bump (scoper)
        id: bump
        shell: bash
        run: |
          CURR="$(jq -r .version apps/scoper/package.json)"
          PREV="$(git show HEAD^:apps/scoper/package.json 2>/dev/null | jq -r .version || echo '')"
          echo "curr=$CURR prev=$PREV"
          if [ -n "$PREV" ] && [ "$CURR" != "$PREV" ]; then
            echo "SHOULD_SEMVER=true" >> "$GITHUB_ENV"
          else
            echo "SHOULD_SEMVER=false" >> "$GITHUB_ENV"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bilbomd-scoper
          tags: |
            # main: semver only if version bumped
            type=raw,value=${{ env.VERSION }},enable=${{ github.ref == 'refs/heads/main' && env.SHOULD_SEMVER == 'true' }}
            # main: always add 'latest' tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # pull requests: single concise tag
            type=raw,value=pr-${{ github.event.pull_request.number }}-${{ env.SHORT_SHA }},enable=${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

      # Removed local buildx cache setup for GitHub-hosted runners

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/scoper/bilbomd-scoper.dockerfile
          push: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          cache-from: type=gha,scope=scoper
          cache-to: type=gha,mode=max,scope=scoper
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            USER_ID=${{ vars.USER_ID || '1001' }}
            GROUP_ID=${{ vars.GROUP_ID || '1234' }}
            SCOPER_GIT_HASH=${{ github.sha }}
            SCOPER_VERSION=${{ env.VERSION }}
          # Removed local cache-from/cache-to for GitHub-hosted runners

  schema:
    name: Build mongodb-schema
    if: needs.changes.outputs.schema == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]')
    needs: [changes, lint]
    runs-on: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # 1) Setup Node from .nvmrc (NO pnpm cache here)
      - name: Use Node (from .nvmrc if present)
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      # 2) Activate exact pnpm via Corepack
      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm version from package.json
        id: pnpm_version
        run: |
          PNPM_VERSION=$(jq -r '.packageManager' package.json | sed -E 's/^pnpm@([0-9.]+).*/\1/')
          echo "pnpm_version=$PNPM_VERSION" >> $GITHUB_OUTPUT

      - name: Activate pnpm
        run: corepack prepare pnpm@${{ steps.pnpm_version.outputs.pnpm_version }} --activate

      - name: Determine pnpm store path
        id: pnpm_store
        run: echo "store_path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm_store.outputs.store_path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Turborepo outputs
        uses: actions/cache@v5
        with:
          path: |
            .turbo
            apps/backend/.turbo
            apps/ui/.turbo
            apps/worker/.turbo
            apps/scoper/.turbo
            packages/bilbomd-types/.turbo
            packages/md-utils/.turbo
            packages/mongodb-schema/.turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Only cache TS incremental build info for schema package (keep pnpm store local)
      - name: Cache TS incremental (schema)
        uses: actions/cache@v5
        with:
          path: |
            packages/mongodb-schema/tsconfig.tsbuildinfo
          key: schema-tsbuild-${{ runner.os }}-${{ hashFiles('packages/mongodb-schema/tsconfig.json', 'packages/mongodb-schema/src/**/*.ts') }}
          restore-keys: |
            schema-tsbuild-${{ runner.os }}-

      # Debug versions
      - name: Show tool versions
        run: |
          node -v
          pnpm -v
          jq -r '.packageManager' package.json

      - name: Install deps
        run: |
          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            pnpm install --prefer-offline
          else
            pnpm install --frozen-lockfile --prefer-offline
          fi

      - name: Build schema
        run: pnpm -C packages/mongodb-schema run build

  md-utils:
    name: Build & Test md-utils
    if: needs.changes.outputs.md-utils == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]')
    needs: [changes, lint]
    runs-on: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # 1) Setup Node from .nvmrc (NO pnpm cache here)
      - name: Use Node (from .nvmrc if present)
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      # 2) Activate exact pnpm via Corepack
      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm version from package.json
        id: pnpm_version
        run: |
          PNPM_VERSION=$(jq -r '.packageManager' package.json | sed -E 's/^pnpm@([0-9.]+).*/\1/')
          echo "pnpm_version=$PNPM_VERSION" >> $GITHUB_OUTPUT

      - name: Activate pnpm
        run: corepack prepare pnpm@${{ steps.pnpm_version.outputs.pnpm_version }} --activate

      - name: Determine pnpm store path
        id: pnpm_store
        run: echo "store_path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm_store.outputs.store_path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Turborepo outputs
        uses: actions/cache@v5
        with:
          path: |
            .turbo
            apps/backend/.turbo
            apps/ui/.turbo
            apps/worker/.turbo
            apps/scoper/.turbo
            packages/bilbomd-types/.turbo
            packages/md-utils/.turbo
            packages/mongodb-schema/.turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Only cache TS incremental build info for md-utils package (keep pnpm store local)
      - name: Cache TS incremental (md-utils)
        uses: actions/cache@v5
        with:
          path: |
            packages/md-utils/tsconfig.tsbuildinfo
          key: md-utils-tsbuild-${{ runner.os }}-${{ hashFiles('packages/md-utils/tsconfig.json', 'packages/md-utils/src/**/*.ts') }}
          restore-keys: |
            md-utils-tsbuild-${{ runner.os }}-

      # Debug versions
      - name: Show tool versions
        run: |
          node -v
          pnpm -v
          jq -r '.packageManager' package.json

      - name: Install deps
        run: |
          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            pnpm install --prefer-offline
          else
            pnpm install --frozen-lockfile --prefer-offline
          fi

      - name: Build dependencies
        run: |
          pnpm -C packages/bilbomd-types run build
          pnpm -C packages/mongodb-schema run build

      - name: Build md-utils
        run: pnpm -C packages/md-utils run build

      - name: Test md-utils
        run: pnpm -C packages/md-utils run test

  scoper-typecheck:
    name: Scoper typecheck
    if: needs.changes.outputs.scoper == 'true'
    needs: [changes, lint]
    runs-on: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Use Node (from .nvmrc if present)
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm version from package.json
        id: pnpm_version
        run: |
          PNPM_VERSION=$(jq -r '.packageManager' package.json | sed -E 's/^pnpm@([0-9.]+).*/\1/')
          echo "pnpm_version=$PNPM_VERSION" >> $GITHUB_OUTPUT

      - name: Activate pnpm
        run: corepack prepare pnpm@${{ steps.pnpm_version.outputs.pnpm_version }} --activate

      - name: Determine pnpm store path
        id: pnpm_store
        run: echo "store_path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm_store.outputs.store_path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Turborepo outputs
        uses: actions/cache@v5
        with:
          path: |
            .turbo
            apps/backend/.turbo
            apps/ui/.turbo
            apps/worker/.turbo
            apps/scoper/.turbo
            packages/bilbomd-types/.turbo
            packages/md-utils/.turbo
            packages/mongodb-schema/.turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install deps
        run: |
          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            pnpm install --prefer-offline
          else
            pnpm install --frozen-lockfile --prefer-offline
          fi

      - name: Build shared packages
        run: |
          pnpm -C packages/mongodb-schema run build
          pnpm -C packages/bilbomd-types run build

      - name: Typecheck scoper
        run: pnpm exec tsc -p apps/scoper/tsconfig.json --noEmit


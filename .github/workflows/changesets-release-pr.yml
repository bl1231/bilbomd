name: Changesets – Release PR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changesets-release-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-pr:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: [ubuntu-24.04]
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm version from package.json
        id: pnpm_version
        run: |
          PNPM_VERSION=$(jq -r '.packageManager' package.json | sed -E 's/^pnpm@([0-9.]+).*/\1/')
          echo "pnpm_version=$PNPM_VERSION" >> $GITHUB_OUTPUT

      - name: Activate pnpm via Corepack
        run: |
          corepack prepare pnpm@${{ steps.pnpm_version.outputs.pnpm_version }} --activate
          pnpm -v

      # Removed local pnpm store setup for GitHub-hosted runners

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Check for pending changesets
        id: check_changesets
        run: |
          count=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Create or update Version Packages PR
        if: steps.check_changesets.outputs.count != '0'
        uses: changesets/action@v2.1.1
        with:
          # Bump package versions AND sync the in-house image tags in the
          # infra compose/helm files in the same Version Packages PR, so the
          # deployment files are already up to date the moment the release
          # merges (no waiting for Renovate). changesets/action stages all
          # working-tree changes (git add .), so the infra edits are committed
          # onto the release branch alongside the version bumps.
          version: pnpm run changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

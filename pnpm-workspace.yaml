packages:
  - 'apps/*'
  - 'packages/*'
injectWorkspacePackages: true

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': true
  core-js-pure: false
  esbuild: true
  msgpackr-extract: true
  msw: true
  unrs-resolver: true

# concurrently@10.0.5 pins shell-quote@1.9.0 (GHSA-pqg4-j6r4-53mv). Drop this
# once concurrently >=10.0.6 is adopted.
overrides:
  'shell-quote@1.9.0': '1.12.0'
  # swagger-jsdoc pins glob 11.1.0 and express-handlebars 8 needs glob 13; glob <14.0.2
  # has an AbortSignal cancellation bypass. Drop each once its parent uses glob >=14.0.2.
  'swagger-jsdoc>glob': '^14.0.3'
  'express-handlebars>glob': '^14.0.3'

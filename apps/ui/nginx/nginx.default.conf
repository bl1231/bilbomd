server {
    listen       80;
    server_name  localhost;

    client_max_body_size 100M;

    location = /api/v1/auth/orcid/callback {
        client_max_body_size 80M;
        proxy_pass http://backend:3500;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        # proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Debug-Orcid-Callback-Routed "true";
    }

    # Add this location block for video streaming with caching
    location ~ ^/api/v1/jobs/.*/movies/.*\.(mp4|webm|mov)$ {
        proxy_pass http://backend:3500;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable caching for videos
        proxy_cache_valid 200 1h;
        proxy_cache_key $scheme$proxy_host$request_uri;
        
        # Support range requests for video seeking
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    location /api {
        client_max_body_size 80M;
        client_body_buffer_size 80M;
        proxy_pass http://backend:3500;
        proxy_intercept_errors off; # Avoid Nginx intercepting error responses
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;  # Add this to forward Cloudflare's client IP
        proxy_set_header CF-IPCountry $http_cf_ipcountry;  # Optional: Forward country for logging
        proxy_set_header CF-Ray $http_cf_ray;  # Optional: Forward ray ID for debugging
        proxy_http_version 1.1;
        # proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html must never be cached — it references hashed assets whose
    # names change on every build, so a stale index.html causes chunk 404s.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed asset filenames are immutable; cache them aggressively.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /admin/bullmq {
        auth_request /internal/bullmq-auth;
        error_page 401 403 =302 /login;

        client_max_body_size 2M;
        proxy_pass http://backend:3500;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        # proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ensure that the path is correctly forwarded to Express
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /internal/bullmq-auth {
        internal;
        proxy_pass http://backend:3500/api/v1/admin/bullmq-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /sfapi {
        client_max_body_size 80M;
        proxy_pass http://backend:3500;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        # proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve version.json
    location /version-info {
        alias /usr/share/nginx/html/version.json;
        add_header Content-Type application/json;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

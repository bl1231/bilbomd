apiVersion: v1
kind: Service
metadata:
  # The UI's nginx proxies to http://backend:3500, so the name is fixed.
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bilbomd.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "bilbomd.selector" (dict "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 3500
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bilbomd.labels" . | nindent 4 }}
    {{- include "bilbomd.selector" (dict "component" "backend") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "bilbomd.selector" (dict "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bilbomd.selector" (dict "component" "backend") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "bilbomd.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.appUser.uid }}
        runAsGroup: {{ .Values.appUser.gid }}
        fsGroup: {{ .Values.appUser.gid }}
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Create the directories the backend expects on the shared volume, owned
        # by the app user (kubelet-created subPath dirs would be root-owned).
        - name: init-dirs
          image: {{ include "bilbomd.image" .Values.images.backend | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["sh", "-c", "mkdir -p /data/uploads /data/logs/backend /data/backups"]
          resources:
            {{- toYaml .Values.resources.init | nindent 12 }}
          securityContext:
            {{- include "bilbomd.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
      containers:
        - name: backend
          image: {{ include "bilbomd.image" .Values.images.backend | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          envFrom:
            - configMapRef: { name: bilbomd-config }
            - secretRef: { name: bilbomd-secrets }
          ports:
            - name: http
              containerPort: 3500
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          securityContext:
            {{- include "bilbomd.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /bilbomd/uploads, subPath: uploads }
            - { name: data, mountPath: /bilbomd/logs, subPath: logs/backend }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bilbomd-data

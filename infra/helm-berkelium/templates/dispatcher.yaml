{{- if .Values.dispatcher.enabled }}
# The worker in its k8s execution backend: it takes BilboMD jobs off the
# BullMQ queues and runs each one as a Kubernetes Job (worker image,
# `node dist/run-job.js`), then waits for it. It runs no science itself, so it
# needs little CPU and no GPU. Its ServiceAccount was created by Science IT with
# a Role that allows creating, watching and deleting Jobs and reading pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bilbomd.labels" . | nindent 4 }}
    {{- include "bilbomd.selector" (dict "component" "dispatcher") | nindent 4 }}
spec:
  replicas: 1
  # One dispatcher at a time, so the concurrency cap holds during upgrades.
  # Running Jobs carry on while it restarts; the new one adopts them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bilbomd.selector" (dict "component" "dispatcher") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bilbomd.selector" (dict "component" "dispatcher") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.dispatcher.serviceAccountName }}
      {{- include "bilbomd.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.appUser.uid }}
        runAsGroup: {{ .Values.appUser.gid }}
        fsGroup: {{ .Values.appUser.gid }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dispatcher
          image: {{ include "bilbomd.image" .Values.images.worker | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          envFrom:
            - configMapRef: { name: bilbomd-config }
            - secretRef: { name: bilbomd-secrets }
          env:
            - { name: EXECUTION_BACKEND, value: k8s }
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            # Job pods run the same worker image and tag as the dispatcher
            - name: K8S_JOB_IMAGE
              value: {{ include "bilbomd.image" .Values.images.worker | quote }}
            - { name: K8S_JOB_IMAGE_PULL_POLICY, value: {{ .Values.images.pullPolicy | quote }} }
            # Job pods need the same pull secrets for a private worker image
            - { name: K8S_JOB_IMAGE_PULL_SECRETS, value: {{ join "," .Values.images.pullSecrets | quote }} }
            - { name: K8S_JOB_CONFIGMAP, value: bilbomd-config }
            - { name: K8S_JOB_SECRET, value: bilbomd-secrets }
            - { name: K8S_JOB_DATA_PVC, value: bilbomd-data }
            - { name: K8S_JOB_DATA_SUBPATH, value: uploads }
            - { name: K8S_JOB_RUN_AS_USER, value: {{ .Values.appUser.uid | quote }} }
            - { name: K8S_JOB_RUN_AS_GROUP, value: {{ .Values.appUser.gid | quote }} }
            - { name: K8S_JOB_CPU_REQUEST, value: {{ .Values.resources.job.requests.cpu | quote }} }
            - { name: K8S_JOB_MEMORY_REQUEST, value: {{ .Values.resources.job.requests.memory | quote }} }
            - { name: K8S_JOB_CPU_LIMIT, value: {{ .Values.resources.job.limits.cpu | quote }} }
            - { name: K8S_JOB_MEMORY_LIMIT, value: {{ .Values.resources.job.limits.memory | quote }} }
            - { name: K8S_GPU_CLAIM_TEMPLATE, value: {{ .Values.dispatcher.gpu.claimTemplateName | quote }} }
            - { name: K8S_MAX_JOBS, value: {{ .Values.dispatcher.maxJobs | quote }} }
            - { name: K8S_JOB_DEADLINE_SECONDS, value: {{ .Values.dispatcher.jobDeadlineSeconds | quote }} }
            - { name: K8S_JOB_TTL_SECONDS, value: {{ .Values.dispatcher.jobTtlSeconds | quote }} }
            # Nothing renders movies on Berkelium yet
            - { name: ENABLE_MOVIES, value: 'false' }
            - { name: BILBOMD_LOGS, value: /bilbomd/logs }
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /config, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /config, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.dispatcher | nindent 12 }}
          securityContext:
            {{- include "bilbomd.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /bilbomd/uploads, subPath: uploads }
            - { name: logs, mountPath: /bilbomd/logs }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bilbomd-data
        - name: logs
          emptyDir: {}
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bilbomd.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "bilbomd.selector" (dict "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bilbomd.labels" . | nindent 4 }}
    {{- include "bilbomd.selector" (dict "component" "ui") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "bilbomd.selector" (dict "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bilbomd.selector" (dict "component" "ui") | nindent 8 }}
    spec:
      {{- include "bilbomd.imagePullSecrets" . | nindent 6 }}
      containers:
        # Stock nginx:alpine-based image: the master process starts as root to
        # bind :80 and drops to the nginx user for workers.
        - name: ui
          image: {{ include "bilbomd.image" .Values.images.ui | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /version-info, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.ui | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "NET_BIND_SERVICE", "SETGID", "SETUID"]

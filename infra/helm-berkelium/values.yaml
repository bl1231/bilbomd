# Values for BilboMD on Berkelium. See README.md and issue #1194.
#
# Berkelium admission rules that shape these values:
#   - every container (init containers too) sets CPU + memory requests AND limits
#   - PVCs use storageClassName ceph-rbd (RWO) or cephfs (RWX)
#   - pods are IPv6-only, so servers must listen on ::

namespace: bilbomd

# Public name of the app. *.bk.lbl.gov resolves to the shared gateway; it is
# internal to LBL until a Cloudflare CNAME is requested via iprequest.lbl.gov.
hostname: bilbomd.bk.lbl.gov

# Shared Envoy Gateway the HTTPRoute attaches to (TLS terminates here).
gateway:
  name: ingress
  namespace: gateway
  sectionName: https

# Images are pulled through Harbor's public proxy-cache projects
# (harbor.bk.lbl.gov/ghcr.io/..., harbor.bk.lbl.gov/docker.io/...), so no push
# step or pull secret is needed for images published to ghcr.io / Docker Hub.
images:
  ui:
    repository: harbor.bk.lbl.gov/ghcr.io/bl1231/bilbomd-ui
    tag: 2.42.1
  backend:
    repository: harbor.bk.lbl.gov/ghcr.io/bl1231/bilbomd-backend
    tag: 2.21.3
  # The dispatcher and the per-job pods. Needs a release with dist/run-job.js.
  worker:
    repository: harbor.bk.lbl.gov/ghcr.io/bl1231/bilbomd-worker
    tag: 2.26.6
  mongo:
    repository: harbor.bk.lbl.gov/docker.io/library/mongo
    tag: 8.3.13
  redis:
    repository: harbor.bk.lbl.gov/docker.io/library/redis
    tag: 8.10.3
  # Structure-prediction services, run as a sidecar in AlphaFold/OpenFold job
  # pods. Versioned on their own (apps/*-service/version), not by changesets.
  colabfoldService:
    repository: harbor.bk.lbl.gov/ghcr.io/bl1231/bilbomd-colabfold-service
    tag: 0.2.0
  of3Service:
    repository: harbor.bk.lbl.gov/ghcr.io/bl1231/bilbomd-of3-service
    tag: 0.1.0
  pullPolicy: IfNotPresent
  # Only needed for images in the private harbor.bk.lbl.gov/bilbomd project.
  pullSecrets: []

# UID/GID baked into the bilbomd-backend/-worker images by CI (repo variables
# USER_ID / GROUP_ID). The backend, dispatcher and job pods share these so they
# can all write the job directories on the shared cephfs volume.
appUser:
  uid: 62704
  gid: 1001

storage:
  # Job directories, backend logs and mongodump archives (cephfs, RWX: mounted
  # by the backend now and by the per-job pods later).
  data:
    storageClassName: cephfs
    size: 500Gi
  mongo:
    storageClassName: ceph-rbd
    size: 20Gi
  redis:
    storageClassName: ceph-rbd
    size: 5Gi

resources:
  ui:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  backend:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: '2', memory: 2Gi }
  mongo:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { cpu: '2', memory: 4Gi }
  redis:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }
  init:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }
  mongoBackup:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: '1', memory: 1Gi }
  of3Weights:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: '2', memory: 4Gi }
  dispatcher:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: '1', memory: 1Gi }
  # Each BilboMD job's pod (CPU and GPU jobs alike, for the pilot). FoXS sizes
  # its worker pool from the CPU limit (cgroup quota); A40 nodes have 64 CPUs.
  job:
    requests: { cpu: '8', memory: 8Gi }
    limits: { cpu: '32', memory: 16Gi }

# Runs each BilboMD job as a Kubernetes Job (see templates/dispatcher.yaml).
dispatcher:
  enabled: true
  # Created by Science IT (not this chart) with a Role to create, watch and
  # delete Jobs and read pods and their logs
  serviceAccountName: bilbomd
  # BilboMD jobs running at once. Berkelium asked for 2-4 GPUs to start with
  # ("if you see a lot pending, you're using too many"). Multi jobs (CPU only)
  # run one at a time on top of this.
  maxJobs: 2
  # Kubernetes stops a job pod that runs longer than this
  jobDeadlineSeconds: 43200
  # Finished Jobs, their pods and logs are kept this long
  jobTtlSeconds: 86400
  gpu:
    claimTemplateName: bilbomd-gpu
    deviceClassName: nvidia-a40

# AlphaFold (ColabFold) and OpenFold3 jobs: the dispatcher adds the matching
# service to the job's pod as a sidecar that shares its GPU, so no GPU is held
# between jobs. The ColabFold weights are inside its image; the OpenFold3
# weights live on the data volume (of3Weights below).
foldSidecar:
  # /dev/shm for JAX/PyTorch (epyc's compose services use 16 GB)
  shmSize: 16Gi
  resources:
    requests: { cpu: '2', memory: 16Gi }
    limits: { cpu: '8', memory: 64Gi }

# One-time download of the OpenFold3 weights into of3-data/ on the data
# volume. Runs after each install/upgrade and does nothing once the file is
# there with the expected checksum. Helm waits for this hook: deploy with
# --timeout 20m (see README), since its first run takes ~8 min.
of3Weights:
  enabled: true
  subPath: of3-data
  source: s3://openfold/staging/of3-p2-155k.pt
  file: of3-p2-155k.pt
  sha256: 3ae79a701f55dbc184002d010c92d347a35faabb981314c2fd1325211af40b77

mongoBackup:
  enabled: true
  schedule: '0 2 * * *'
  retentionDays: 14

env:
  NODE_ENV: production
  BILBOMD_ENV: production

# Job types offered in the UI. Scoper is never deployed on Berkelium.
features:
  ENABLE_BILBOMD_SANS: 'true'
  ENABLE_BILBOMD_MULTI: 'true'
  ENABLE_BILBOMD_ALPHAFOLD: 'true'
  ENABLE_BILBOMD_OPENFOLD: 'true'
  ENABLE_BILBOMD_SCOPER: 'false'
  ENABLE_CHARMM_ENGINE: 'false'
  ENABLE_HOME_PAGE_ALERT: 'false'

email:
  SEND_EMAIL_NOTIFICATIONS: 'false' # enable once SMTP egress is confirmed
  SEND_EMAIL_USER: bilbomd@lbl.gov
  BILBOMD_MAILER_HOST: smtp-relay.gmail.com
  BILBOMD_MAILER_PORT: '25'
  BILBOMD_MAILER_SECURE: 'false'

orcid:
  enabled: 'false'
  issuer: https://orcid.org
  clientId: APP-XXXXXXXXXXX
  publicApiUrl: https://pub.orcid.org/v3.0

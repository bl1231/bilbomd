# --------------------------------------------------------------------------------------
# Use this Docker compose file for development deployment on Hyperion
#
# Currently only the scoper service is deployed using this file.
# because of dependency of KGSRna binary only runs on Intel
# --------------------------------------------------------------------------------------

networks:
  app-network-dev:
    driver: bridge

services:
  scoper:
    image: ghcr.io/bl1231/bilbomd-scoper:1.7.8
    pull_policy: always
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp/bilbomd-seccomp.json
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "6"
    restart: no
    env_file:
      - .env.hyperion.dev
    networks:
      - app-network-dev
    volumes:
      - /bilbomd/dev/uploads:/bilbomd/uploads
      - /bilbomd/dev/logs:/bilbomd/logs

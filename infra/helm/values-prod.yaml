ingress:
  host: 'ingress.bilbomd.production.svc.spin.nersc.org'
  fqdn: 'bilbomd-nersc.bl1231.als.lbl.gov'
  # Let's Encrypt cert auto-renewed by the tls-acme CronJob (see infra/tls-acme/).
  # Only flip to 'tls-cert' AFTER the initial cert job has populated the secret,
  # otherwise the Ingress briefly serves the self-signed placeholder.
  secret: 'tls-cert'

bilbomd:
  url: 'https://bilbomd-nersc.bl1231.als.lbl.gov'

env:
  NODE_ENV: 'production'
  BILBOMD_ENV: 'production'

auth:
  orcid_issuer: 'https://orcid.org'
  orcid_client_id: 'APP-XXXXXXXXXX'
  orcid_redirect_uri: 'https://bilbomd-nersc.bl1231.als.lbl.gov/api/v1/auth/orcid/callback'

logs:
  backend: 'bilbomd/prod/logs/backend'
  worker: 'bilbomd/prod/logs/worker'
  ui: 'bilbomd/prod/logs/ui'

backups: 'bilbomd/prod/backups'

scripts: 'bilbomd/prod/scripts'

uploads: 'bilbomd/prod/uploads'

working_dir: 'bilbomd/prod/'

mongo:
  name: mongo
  image:
    repository: mongo
    tag: 8.3.4
    pullPolicy: IfNotPresent
    secret: registry-nersc
  config:
    MONGO_INITDB_ROOT_USERNAME: 'bilbomd-backend-user'

redis:
  name: redis
  image:
    repository: redis
    tag: 8.8.0
    pullPolicy: Always
    secret: registry-nersc

ui:
  name: ui
  image:
    repository: ghcr.io/bl1231/bilbomd-ui
    tag: 2.20.4
    pullPolicy: Always
    secret: ghcr

backend:
  name: backend
  image:
    repository: ghcr.io/bl1231/bilbomd-backend
    tag: 2.9.8
    pullPolicy: Always
    secret: ghcr

worker:
  name: worker
  image:
    repository: ghcr.io/bl1231/bilbomd-worker
    tag: 2.14.8
    pullPolicy: Always
    secret: ghcr

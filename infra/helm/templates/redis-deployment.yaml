apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    field.cattle.io/description: Redis Server for BilboMD
  labels:
    workload.user.cattle.io/workloadselector: apps.deployment-{{ .Values.namespace }}-{{ .Values.redis.name }}
  name: "{{ .Values.redis.name }}"
  namespace: "{{ .Values.namespace }}"
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-{{ .Values.namespace }}-{{ .Values.redis.name }}
  strategy:
    # Single replica on a ReadWriteOnce PVC: terminate the old pod before
    # starting the new one so the new pod can mount its volume without a
    # Multi-Attach error during version upgrades.
    type: Recreate
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: apps.deployment-{{ .Values.namespace }}-{{ .Values.redis.name }}
    spec:
      affinity: {}
      containers:
        - command:
            - redis-server
            - --save
            - "20"
            - "1"
            - --loglevel
            - warning
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: "{{ .Values.redis.image.pullPolicy }}"
          name: container-0
          ports:
            - containerPort: 6379
              name: 6379tcp
              protocol: TCP
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
                - NET_BIND_SERVICE
                - SETGID
                - SETUID
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
          stdin: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          tty: true
          volumeMounts:
            - mountPath: /data
              name: vol-redis
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: vol-redis
          persistentVolumeClaim:
            claimName: redis-volume

ingress:
  host: 'ingress.bilbomd.development.svc.spin.nersc.org'
  fqdn: 'bilbomd-nersc-dev.bl1231.als.lbl.gov'
  # Let's Encrypt cert auto-renewed by the tls-acme CronJob (see infra/tls-acme/).
  # Only flip to 'tls-cert' AFTER the initial cert job has populated the secret,
  # otherwise the Ingress briefly serves the self-signed placeholder.
  secret: 'tls-cert'

bilbomd:
  url: 'https://bilbomd-nersc-dev.bl1231.als.lbl.gov'

env:
  NODE_ENV: 'development'
  BILBOMD_ENV: 'development'

auth:
  orcid_issuer: 'https://sandbox.orcid.org'
  orcid_client_id: 'APP-X9112LN3N2ZS1ATI'
  orcid_redirect_uri: 'https://bilbomd-nersc-dev.bl1231.als.lbl.gov/api/v1/auth/orcid/callback'

logs:
  backend: 'bilbomd/dev/logs/backend'
  worker: 'bilbomd/dev/logs/worker'
  ui: 'bilbomd/dev/logs/ui'

backups: 'bilbomd/dev/backups'

scripts: 'bilbomd/dev/scripts'

uploads: 'bilbomd/dev/uploads'

working_dir: 'bilbomd/dev/'

mongo:
  name: mongo
  image:
    repository: mongo
    tag: 8.3.7
    pullPolicy: IfNotPresent
    secret: registry-nersc
  config:
    MONGO_INITDB_ROOT_USERNAME: 'bilbomd-backend-user'

redis:
  name: redis
  image:
    repository: redis
    tag: 8.10.0
    pullPolicy: Always
    secret: registry-nersc

ui:
  name: ui
  image:
    repository: ghcr.io/bl1231/bilbomd-ui
    tag: 2.22.2
    pullPolicy: Always
    secret: ghcr

backend:
  name: backend
  image:
    repository: ghcr.io/bl1231/bilbomd-backend
    tag: 2.10.2
    pullPolicy: Always
    secret: ghcr

worker:
  name: worker
  image:
    repository: ghcr.io/bl1231/bilbomd-worker
    tag: 2.16.0
    pullPolicy: Always
    secret: ghcr

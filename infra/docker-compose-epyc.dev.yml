# --------------------------------------------------------------------------------------
# Use this Docker compose file for development deployment on Epyc
# You may need to create the following volumes before running this file:
#
#  docker volume create bilbomd-mongodb-dev
#  docker volume create bilbomd-redis-cache-dev
#  docker volume create bilbomd-scratch-dev
#
# You will also need to copy .env.example to .env.dev and maybe adjust some
# of the values in the .env.dev file.
#
# Possibly need to change the ownership of the uploads and logs volumes
# to match the user and group IDs used in the backend and worker containers:
# docker run --rm -v bilbomd-uploads-dev:/data alpine:latest chown -R 62704:1001 /data
# docker run --rm -v bilbomd-logs-dev:/data alpine:latest chown -R 62704:1001 /data
# --------------------------------------------------------------------------------------
volumes:
  mongodb:
    name: bilbomd-mongodb-dev
    external: true
  redis-cache:
    name: bilbomd-redis-cache-dev
    external: true
  scratch:
    name: bilbomd-scratch-dev
    external: true

networks:
  app-network-dev:
    driver: bridge

services:
  # ------------------------------------------------------------------------------------
  mongodb:
    image: mongo:8.3.1
    pull_policy: always
    restart: always
    healthcheck:
      test: echo 'db.runCommand({serverStatus:1}).ok' | mongosh admin -u
        $MONGO_USERNAME -p $MONGO_PASSWORD --quiet | grep 1
      interval: 10s
      timeout: 10s
      retries: 7
      start_period: 20s
    env_file:
      - .env.dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: $MONGO_USERNAME
      MONGO_INITDB_ROOT_PASSWORD: $MONGO_PASSWORD
    ports:
      - "${MONGO_DEV_BIND_ADDR:?err}:${MONGO_EXTERNAL_PORT:?err}:27017"
    volumes:
      - mongodb:/data/db
    networks:
      - app-network-dev

  # ------------------------------------------------------------------------------------
  redis:
    image: redis:8.6.3
    pull_policy: always
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    env_file:
      - path: .env.dev
    ports:
      - "${REDIS_DEV_BIND_ADDR:?err}:${REDIS_EXTERNAL_PORT:?err}:6379"
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis-cache:/data
    networks:
      - app-network-dev

  # ------------------------------------------------------------------------------------
  backend:
    image: ghcr.io/bl1231/bilbomd-backend:2.7.8
    pull_policy: always
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp/bilbomd-seccomp.json
    deploy:
      resources:
        limits:
          cpus: "12"
    restart: no
    user: "${UID:-1001}:${GID:-1001}"
    env_file:
      - path: .env.dev
    ports:
      - "${BILBOMD_DEV_BIND_ADDR:?err}:${BILBOMD_BACKEND_PORT:?err}:3500"
    volumes:
      - /bilbomd/dev/uploads:/bilbomd/uploads
      - /bilbomd/dev/logs:/bilbomd/logs
      - scratch:/bilbomd/scratch
    networks:
      - app-network-dev
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:3500/healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------------------------
  worker:
    image: ghcr.io/bl1231/bilbomd-worker:2.9.4
    pull_policy: always
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp/bilbomd-seccomp.json
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "24"
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: no
    read_only: true
    user: "${UID:-1001}:${GID:-1001}"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    env_file:
      - path: .env.dev
    networks:
      - app-network-dev
    volumes:
      - /bilbomd/dev/uploads:/bilbomd/uploads
      - /bilbomd/dev/logs:/bilbomd/logs
      - scratch:/bilbomd/scratch
    environment:
      - ENABLE_BILBOMD_OPENFOLD=${ENABLE_BILBOMD_OPENFOLD:-false}
      - OF3_TIMEOUT_MS=${OF3_TIMEOUT_MS:-3600000}
      - OF3_SERVICE_URL=http://of3-service:8000
      - COLABFOLD_TIMEOUT_MS=${COLABFOLD_TIMEOUT_MS:-3600000}
      - COLABFOLD_SERVICE_URL=http://colabfold-service:8000
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:3000/config" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------------------------
  of3-service:
    image: ghcr.io/bl1231/bilbomd-of3-service:latest
    pull_policy: never
    shm_size: "16gb"
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp/bilbomd-seccomp.json
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: no
    env_file:
      - path: .env.dev
    environment:
      - UPLOAD_DIR=/bilbomd/uploads
      - OF3_DATA_DIR=/bilbomd/of3-data
    volumes:
      - /bilbomd/dev/uploads:/bilbomd/uploads
      - /af2_data/of3:/bilbomd/of3-data:ro
    networks:
      - app-network-dev
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ------------------------------------------------------------------------------------
  # colabfold-service:
  #   image: ghcr.io/bl1231/bilbomd-colabfold-service:latest
  #   pull_policy: always
  #   security_opt:
  #     - no-new-privileges:true
  #     - seccomp:./seccomp/bilbomd-seccomp.json
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [ gpu ]
  #   restart: no
  #   env_file:
  #     - path: .env.dev
  #   environment:
  #     - UPLOAD_DIR=/bilbomd/uploads
  #     - COLABFOLD_DATA_DIR=/cache
  #   volumes:
  #     - /bilbomd/dev/uploads:/bilbomd/uploads
  #     - /bilbomd/colabfold-cache:/cache:ro
  #   networks:
  #     - app-network-dev
  #   healthcheck:
  #     test: [ "CMD", "curl", "--fail", "http://localhost:8000/health" ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s

  # ------------------------------------------------------------------------------------
  ui:
    image: ghcr.io/bl1231/bilbomd-ui:pr-724-877720d4
    pull_policy: always
    security_opt:
      - seccomp:./seccomp/bilbomd-seccomp.json
      - no-new-privileges:true
    env_file:
      - .env.dev
    ports:
      - "${BILBOMD_DEV_BIND_ADDR:?err}:${BILBOMD_UI_PORT:?err}:80"
    networks:
      - app-network-dev
    depends_on:
      - backend
      - mongodb
      - redis
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

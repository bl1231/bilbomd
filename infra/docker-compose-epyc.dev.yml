# --------------------------------------------------------------------------------------
# Use this Docker compose file for development deployment on Epyc
# You may need to create the following volumes before running this file:
#
#  docker volume create bilbomd-mongodb-dev
#  docker volume create bilbomd-redis-cache-dev
#  docker volume create bilbomd-scratch-dev
#
# You will also need to copy .env.example to .env.dev and maybe adjust some
# of the values in the .env.dev file.
#
# Possibly need to change the ownership of the uploads and logs volumes
# to match the user and group IDs used in the backend and worker containers:
# docker run --rm -v bilbomd-uploads-dev:/data alpine:latest chown -R 62704:1001 /data
# docker run --rm -v bilbomd-logs-dev:/data alpine:latest chown -R 62704:1001 /data
# --------------------------------------------------------------------------------------
volumes:
  mongodb:
    name: bilbomd-mongodb-dev
    external: true
  redis-cache:
    name: bilbomd-redis-cache-dev
    external: true
  scratch:
    name: bilbomd-scratch-dev
    external: true
  # Pipe directory shared by the MPS daemon and the worker. tmpfs, so a stale
  # pipe never survives a restart.
  mps-pipe:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: 'size=16m,uid=${UID:-1001},gid=${GID:-1001},mode=0700'

networks:
  app-network-dev:
    driver: bridge

services:
  # ------------------------------------------------------------------------------------
  mongodb:
    image: mongo:8.3.11
    pull_policy: missing
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: '4g'
    healthcheck:
      test: echo 'db.runCommand({serverStatus:1}).ok' | mongosh admin -u
        $MONGO_USERNAME -p $MONGO_PASSWORD --quiet | grep 1
      interval: 10s
      timeout: 10s
      retries: 7
      start_period: 20s
    env_file:
      - path: .env.dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: $MONGO_USERNAME
      MONGO_INITDB_ROOT_PASSWORD: $MONGO_PASSWORD
    ports:
      - '${MONGO_DEV_BIND_ADDR:?err}:${MONGO_EXTERNAL_PORT:?err}:27017'
    volumes:
      - mongodb:/data/db
    networks:
      - app-network-dev

  # ------------------------------------------------------------------------------------
  redis:
    image: redis:8.10.2
    pull_policy: missing
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '1g'
    healthcheck:
      # REDISCLI_AUTH only when a password is set; an empty AUTH fails.
      test:
        [
          'CMD-SHELL',
          '[ -n "$$REDIS_PASSWORD" ] && export REDISCLI_AUTH="$$REDIS_PASSWORD"; redis-cli ping | grep -q PONG'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    env_file:
      - path: .env.dev
    ports:
      - '${REDIS_DEV_BIND_ADDR:?err}:${REDIS_EXTERNAL_PORT:?err}:6379'
    # --requirepass only when REDIS_PASSWORD is set (from the env_file), so
    # local stacks without a password keep working.
    command:
      [
        'sh',
        '-c',
        'exec redis-server --save 20 1 --loglevel warning $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
      ]
    volumes:
      - redis-cache:/data
    networks:
      - app-network-dev

  # ------------------------------------------------------------------------------------
  backend:
    image: ghcr.io/bl1231/bilbomd-backend:2.18.1
    pull_policy: missing
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp/bilbomd-seccomp.json
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: '4g'
    restart: always
    user: '${UID:-1001}:${GID:-1001}'
    env_file:
      - path: .env.dev
    ports:
      - '${BILBOMD_DEV_BIND_ADDR:?err}:${BILBOMD_BACKEND_PORT:?err}:3500'
    volumes:
      - /bilbomd/dev/uploads:/bilbomd/uploads
      - /bilbomd/dev/logs:/bilbomd/logs
      - scratch:/bilbomd/scratch
    networks:
      - app-network-dev
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:3500/healthcheck']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------------------------
  # NVIDIA MPS daemon for GPU 0, same setup as prod's (which runs on GPU 1); see
  # docker-compose-epyc.prod.yml. The dev and prod fold services also use GPU 0
  # but don't connect to MPS. If this container restarts, restart the worker too.
  mps:
    image: ghcr.io/bl1231/bilbomd-worker:2.21.2
    pull_policy: missing
    entrypoint: ['nvidia-cuda-mps-control', '-f']
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp/bilbomd-seccomp.json
    ipc: shareable
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    restart: always
    read_only: true
    user: '${UID:-1001}:${GID:-1001}'
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    volumes:
      - mps-pipe:/run/nvidia-mps
    environment:
      - CUDA_MPS_PIPE_DIRECTORY=/run/nvidia-mps
      - CUDA_MPS_LOG_DIRECTORY=/tmp/mps-log
    healthcheck:
      test: ['CMD-SHELL', 'echo get_server_list | nvidia-cuda-mps-control']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ------------------------------------------------------------------------------------
  worker:
    image: ghcr.io/bl1231/bilbomd-worker:2.21.2
    pull_policy: always
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp/bilbomd-seccomp.json
    ipc: 'service:mps'
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '18'
          memory: '32g'
        reservations:
          devices:
            # Same GPU as the mps service. Prod's workers have GPU 1.
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    restart: always
    read_only: true
    user: '${UID:-1001}:${GID:-1001}'
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    env_file:
      - path: .env.dev
    networks:
      - app-network-dev
    volumes:
      - /bilbomd/dev/uploads:/bilbomd/uploads
      - /bilbomd/dev/logs:/bilbomd/logs
      - scratch:/bilbomd/scratch
      - mps-pipe:/run/nvidia-mps
      - ./worker-passwd-epyc:/etc/passwd:ro
    environment:
      - ENABLE_BILBOMD_OPENFOLD=${ENABLE_BILBOMD_OPENFOLD:-false}
      - OF3_TIMEOUT_MS=${OF3_TIMEOUT_MS:-3600000}
      - OF3_SERVICE_URL=http://of3-service:8000
      - COLABFOLD_TIMEOUT_MS=${COLABFOLD_TIMEOUT_MS:-3600000}
      - COLABFOLD_SERVICE_URL=http://colabfold-service:8000
      - MPLCONFIGDIR=/tmp/matplotlib
      - XDG_CACHE_HOME=/tmp/cache
      # All 6 Rg runs at once; only faster than serial because of MPS.
      - OPENMM_MD_CONCURRENCY=${OPENMM_MD_CONCURRENCY:-6}
      - CUDA_MPS_PIPE_DIRECTORY=/run/nvidia-mps
    depends_on:
      mps:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      colabfold-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:3000/config']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------------------------------
  of3-service:
    image: ghcr.io/bl1231/bilbomd-of3-service:0.1.0
    pull_policy: missing
    shm_size: '16gb'
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp/bilbomd-seccomp.json
    deploy:
      resources:
        limits:
          cpus: '2'
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: no
    # Same UID/GID as the worker and backend, so they can delete job dirs
    user: '${UID:-1001}:${GID:-1001}'
    env_file:
      - path: .env.dev
    environment:
      # /root isn't writable for a non-root UID; JAX/PyTorch cache under $HOME
      - HOME=/tmp
      - UPLOAD_DIR=/bilbomd/uploads
      - OF3_DATA_DIR=/bilbomd/of3-data
    volumes:
      - /bilbomd/dev/uploads:/bilbomd/uploads
      - /af2_data/of3:/bilbomd/of3-data:ro
    networks:
      - app-network-dev
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ------------------------------------------------------------------------------------
  colabfold-service:
    image: ghcr.io/bl1231/bilbomd-colabfold-service:0.2.0
    pull_policy: missing
    shm_size: '16gb'
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp/bilbomd-seccomp.json
    deploy:
      resources:
        limits:
          cpus: '2'
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: no
    # Same UID/GID as the worker and backend, so they can delete job dirs
    user: '${UID:-1001}:${GID:-1001}'
    env_file:
      - path: .env.dev
    environment:
      # /root isn't writable for a non-root UID; JAX/PyTorch cache under $HOME
      - HOME=/tmp
      - UPLOAD_DIR=/bilbomd/uploads
      - COLABFOLD_DATA_DIR=/cache
      - COLABFOLD_TIMEOUT_S=${COLABFOLD_TIMEOUT_S:-3300}
    volumes:
      - /bilbomd/dev/uploads:/bilbomd/uploads
      - /bilbomd/colabfold-cache:/cache:ro
    networks:
      - app-network-dev
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ------------------------------------------------------------------------------------
  ui:
    image: ghcr.io/bl1231/bilbomd-ui:2.34.1
    pull_policy: missing
    security_opt:
      - seccomp:./seccomp/bilbomd-seccomp.json
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
    env_file:
      - path: .env.dev
    ports:
      - '${BILBOMD_DEV_BIND_ADDR:?err}:${BILBOMD_UI_PORT:?err}:80'
    networks:
      - app-network-dev
    depends_on:
      - backend
      - mongodb
      - redis
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost/version-info']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

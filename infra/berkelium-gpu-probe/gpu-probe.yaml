# Berkelium GPU availability study (see README.md). Not part of the Helm
# chart: it is a temporary measurement, deployed and removed with deploy.sh.
# Every object carries app.kubernetes.io/part-of=bilbomd-gpu-probe.
#
# One single-GPU ResourceClaimTemplate per GPU type. probe.sh references them
# as gpu-probe-<class>.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-probe-a40
  labels: { app.kubernetes.io/part-of: bilbomd-gpu-probe }
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: { deviceClassName: nvidia-a40 }
---

# --------------------------------------------------------------------------------------------------
# Use this Docker compose file for local installation on your machine.
# You may need to create the following volumes before running this file:
#
#  docker volume create mongodb-local
#  docker volume create redis-cache-local
#  docker volume create uploads-local
#  docker volume create logs-local
#
# You will also need to copy .env.example to .env.local and adjust the
# values in the .env.local file. See INSTALL.md for details.
#
# To start services:
#
#  docker compose --env-file .env.local -f docker-compose.local.yml -p bilbomd-local up -d
#
# To stop and remove services:
#
#  docker compose --env-file .env.local -f docker-compose.local.yml -p bilbomd-local down
# --------------------------------------------------------------------------------------------------
volumes:
  mongodb:
    name: mongodb-local
    external: true
  redis-cache:
    name: redis-cache-local
    external: true
  uploads:
    name: uploads-local
    external: true
  logs:
    name: logs-local
    external: true

networks:
  app-network:
    driver: bridge

services:
  mongodb:
    image: mongo:8.3.2
    pull_policy: missing
    restart: always
    healthcheck:
      test: echo 'db.runCommand({serverStatus:1}).ok' | mongosh admin -u
        $MONGO_USERNAME -p $MONGO_PASSWORD --quiet | grep 1
      interval: 10s
      timeout: 10s
      retries: 7
      start_period: 20s
    env_file:
      - path: .env.local
    environment:
      MONGO_INITDB_ROOT_USERNAME: $MONGO_USERNAME
      MONGO_INITDB_ROOT_PASSWORD: $MONGO_PASSWORD
    ports:
      - "${MONGO_DEV_BIND_ADDR:?err}:${MONGO_EXTERNAL_PORT:?err}:27017"
    volumes:
      - mongodb:/data/db
    networks:
      - app-network

  redis:
    image: redis:8.8.0
    pull_policy: missing
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    env_file:
      - path: .env.local
    ports:
      - "${REDIS_DEV_BIND_ADDR:?err}:${REDIS_EXTERNAL_PORT:?err}:6379"
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis-cache:/data
    networks:
      - app-network

  backend:
    image: ghcr.io/bl1231/bilbomd-backend:2.9.2
    pull_policy: always
    security_opt:
      - seccomp:./seccomp/bilbomd-seccomp.json
      - no-new-privileges:true
    env_file:
      - path: .env.local
    ports:
      - "${BILBOMD_DEV_BIND_ADDR:?err}:${BILBOMD_BACKEND_PORT:?err}:3500"
    volumes:
      - ./uploads-dev:/bilbomd/uploads
      - ./logs/backend:/bilbomd/logs
    networks:
      - app-network
    user: "${UID:-1001}:${GID:-1001}"
    command: [ "node", "dist/server.js" ]
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:3500/healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    image: ghcr.io/bl1231/bilbomd-worker:2.14.5
    pull_policy: always
    security_opt:
      - seccomp:./seccomp/bilbomd-seccomp.json
      - no-new-privileges:true
    read_only: true      
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "16"
          memory: "32g"
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    env_file:
      - .env.local
    networks:
      - app-network
    volumes:
      - ./uploads-dev:/bilbomd/uploads
      - ./logs/worker:/bilbomd/logs
    user: "${UID:-1001}:${GID:-1001}"
    command: [ "node", "dist/worker.js" ]
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:3000/config" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ui:
    image: ghcr.io/bl1231/bilbomd-ui:2.20.2
    pull_policy: always
    security_opt:
      - seccomp:./seccomp/bilbomd-seccomp.json
      - no-new-privileges:true
    env_file:
      - .env.local
    ports:
      - "${BILBOMD_DEV_BIND_ADDR:?err}:${BILBOMD_UI_PORT:?err}:80"
    networks:
      - app-network
    depends_on:
      - backend
      - mongodb
      - redis
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost/version-info" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
